<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GCSE Worksheet QA Studio</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy:    { 950: '#0d1117', 900: '#131929', 800: '#161c2d', 700: '#1c2236', 600: '#212840' },
          brand:   { blue: '#3b82f6', violet: '#8b5cf6', 'blue-dk': '#2563eb', 'violet-dk': '#7c3aed' },
        },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #0d1117; color: #e2e8f0; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #161c2d; }
  ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 3px; }
  textarea { resize: vertical; }
  .grad-text { background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .pipeline-bar { transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }
  @keyframes pulse-blue   { 0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,0.4)}  50%{box-shadow:0 0 0 8px  rgba(59,130,246,0)} }
  @keyframes pulse-violet { 0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,0.5)} 50%{box-shadow:0 0 0 10px rgba(139,92,246,0)} }
  .card-active   { animation: pulse-blue   2s   ease-in-out infinite; }
  .card-parallel { animation: pulse-violet 1.4s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin 0.8s linear infinite; }
  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ── Constants ──────────────────────────────────────────────────────────────
const API = '';  // same origin — FastAPI serves this file at /

const STEPS = [
  { icon: 'filetext',    label: 'Read Files',  detail: 'Parsing docs',         parallel: false },
  { icon: 'sparkles',    label: 'Enhance WS',  detail: 'Improving worksheet',  parallel: false },
  { icon: 'clipboard',   label: 'Mark Scheme', detail: 'Building mark scheme', parallel: false },
  { icon: 'search',      label: 'Agent 1',     detail: 'Command words',        parallel: true  },
  { icon: 'barchart',    label: 'Agent 2',     detail: 'Mark structure',       parallel: true  },
  { icon: 'layers',      label: 'Agent 3',     detail: 'Cognitive balance',    parallel: true  },
  { icon: 'bookopen',    label: 'Agent 4',     detail: 'Topic coverage',       parallel: true  },
  { icon: 'checkcircle', label: 'Agent 5',     detail: 'Final revision',       parallel: false },
];

// ── Colour tokens (Figma Make v3) ─────────────────────────────────────────
const C = {
  bg:       '#0d1117',
  surface:  '#161c2d',
  surface2: '#1c2236',
  surface3: '#212840',
  border:   'rgba(255,255,255,0.07)',
  border2:  'rgba(255,255,255,0.12)',
  text:     '#e2e8f0',
  textMid:  '#94a3b8',
  textMute: '#64748b',
  blue:     '#3b82f6',
  blueLt:   'rgba(59,130,246,0.15)',
  violet:   '#8b5cf6',
  green:    '#22c55e',
  greenLt:  'rgba(34,197,94,0.15)',
  greenBrd: 'rgba(34,197,94,0.30)',
  red:      '#f87171',
};

// ── Small reusable components ─────────────────────────────────────────────

function Logo({ size = 34 }) {
  return (
    <div style={{
      width: size, height: size, borderRadius: 10, overflow: 'hidden',
      flexShrink: 0, boxShadow: '0 2px 10px rgba(124,58,237,0.35)',
      background: 'linear-gradient(135deg,#1c2236,#212840)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      <img src="/logo.png" alt="examqa" style={{ width: '82%', height: '82%', objectFit: 'contain' }}
        onError={e => { e.target.style.display = 'none'; e.target.parentNode.style.background = 'linear-gradient(135deg,#3b82f6,#8b5cf6)'; e.target.parentNode.innerHTML = '<span style="color:#fff;font-size:' + (size*0.47) + 'px">✦</span>'; }}
      />
    </div>
  );
}

function Badge({ children, color = C.blue, bg = C.blueLt }) {
  return (
    <span style={{
      fontSize: 9, fontWeight: 700, color, background: bg,
      borderRadius: 4, padding: '1px 6px', letterSpacing: '0.03em',
    }}>{children}</span>
  );
}

function Divider() {
  return <div style={{ height: 1, background: C.border, margin: '10px 0' }} />;
}

function Spinner({ size = 16 }) {
  return (
    <div className="spinner" style={{
      width: size, height: size, border: `2px solid ${C.border2}`,
      borderTopColor: C.blue, borderRadius: '50%',
    }} />
  );
}

// ── SVG Icon system ───────────────────────────────────────────────────────
function Icon({ name, size = 18, color = 'currentColor', strokeWidth = 2 }) {
  const p = {
    // Pipeline step icons
    filetext:    <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></>,
    sparkles:    <><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></>,
    clipboard:   <><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></>,
    search:      <><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></>,
    barchart:    <><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></>,
    layers:      <><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></>,
    bookopen:    <><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>,
    checkcircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>,
    // UI action icons
    check:       <polyline points="20 6 9 17 4 12"/>,
    upload:      <><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></>,
    doc:         <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></>,
    alignleft:   <><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></>,
    save:        <><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></>,
    zap:         <><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></>,
    download:    <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
    send:        <><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>,
    x:           <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
    export:      <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      style={{ display:'inline-block', flexShrink:0 }}>
      {p[name] || null}
    </svg>
  );
}

// ── UploadZone ────────────────────────────────────────────────────────────
function UploadZone({ icon, label, hint, accept, required, file, onFile, onClear }) {
  const [dragging, setDragging] = useState(false);
  const inputRef = useRef(null);
  const hasFile = !!file;

  const handleDrop = (e) => {
    e.preventDefault();
    e.stopPropagation();
    setDragging(false);
    if (hasFile) return;
    const f = e.dataTransfer.files[0];
    if (f) onFile(f);
  };
  const handleChange = (e) => {
    const f = e.target.files[0];
    if (f) onFile(f);
    e.target.value = '';           // allow re-selecting same file
  };
  const handleDragOver  = (e) => { e.preventDefault(); if (!hasFile) setDragging(true);  };
  const handleDragLeave = (e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDragging(false); };

  const borderCol = hasFile ? C.greenBrd : dragging ? C.blue : (required ? 'rgba(59,130,246,0.3)' : C.border);
  const bgCol     = hasFile ? C.greenLt  : dragging ? C.blueLt : (required ? 'rgba(59,130,246,0.06)' : C.surface2);

  return (
    <div
      onClick={() => !hasFile && inputRef.current.click()}
      onDragOver={handleDragOver}
      onDragEnter={handleDragOver}
      onDragLeave={handleDragLeave}
      onDrop={handleDrop}
      style={{
        background: bgCol,
        border: `1.5px ${dragging ? 'dashed' : 'solid'} ${borderCol}`,
        borderRadius: 10, padding: '8px 10px', marginBottom: 6,
        display: 'flex', alignItems: 'center', gap: 9,
        cursor: hasFile ? 'default' : 'pointer',
        transition: 'all 0.15s',
      }}>
      <input ref={inputRef} type="file" accept={accept} style={{ display: 'none' }} onChange={handleChange} />
      <div style={{
        width: 30, height: 30, borderRadius: 7,
        background: hasFile ? C.greenLt : dragging ? 'rgba(59,130,246,0.2)' : (required ? 'rgba(59,130,246,0.2)' : C.surface3),
        display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
      }}>
        {hasFile
          ? <Icon name="check" size={16} color={C.green} strokeWidth={2.5} />
          : dragging
          ? <Icon name="upload" size={16} color={C.blue} />
          : <Icon name={icon} size={16} color={required ? C.blue : C.textMid} />
        }
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 5, marginBottom: 1 }}>
          <span style={{ fontSize: 11.5, fontWeight: 600, color: hasFile ? C.green : dragging ? C.blue : C.text }}>{label}</span>
          {hasFile
            ? <span style={{ fontSize: 9, color: C.green, background: C.greenLt, border: `1px solid ${C.greenBrd}`, borderRadius: 20, padding: '1px 7px', marginLeft: 'auto' }}>Uploaded</span>
            : <Badge color={required ? C.blue : C.textMute} bg={required ? C.blueLt : C.surface3}>{required ? 'Required' : 'Optional'}</Badge>
          }
          {hasFile && (
            <button onClick={(e) => { e.stopPropagation(); onClear(); }} style={{ marginLeft: 'auto', background: 'none', border: 'none', color: C.red, cursor: 'pointer', padding: '0 2px', display:'flex', alignItems:'center' }}>
              <Icon name="x" size={13} color={C.red} strokeWidth={2.5} />
            </button>
          )}
        </div>
        <div style={{ fontSize: 10, color: dragging ? C.blue : C.textMute }}>
          {hasFile ? file.name : dragging ? 'Drop to upload' : hint}
        </div>
      </div>
    </div>
  );
}

// ── Pipeline progress strip ───────────────────────────────────────────────
function Pipeline({ currentStep, stepDetail }) {
  // Agents 1-4 (indices 3-6) are fired together at SSE step=3
  // They all complete at step=7 (when Agent 5 fires)
  const parallelFiring = currentStep === 3;
  const done = currentStep >= STEPS.length;

  // Slowly animate the bar while parallel agents run, so it doesn't sit frozen at 37%
  const [animPct, setAnimPct] = React.useState(null);
  React.useEffect(() => {
    if (currentStep === 3) {
      setAnimPct(38);
      const id = setInterval(() => {
        setAnimPct(p => (p < 83 ? parseFloat((p + 0.4).toFixed(1)) : 83));
      }, 500); // +0.4% every 500 ms → ~56 s to travel 38→83%
      return () => clearInterval(id);
    }
    setAnimPct(null);
  }, [currentStep]);

  const basePct = done ? 100 : Math.min(95, Math.round((currentStep / STEPS.length) * 100));
  const pct = (parallelFiring && animPct !== null) ? animPct : basePct;

  return (
    <div style={{
      background: `linear-gradient(to right, ${C.surface}, ${C.surface2})`,
      borderBottom: `1px solid ${C.border}`,
      padding: '16px 24px 18px',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
        <div style={{ fontSize: '0.72rem', fontWeight: 500, color: C.textMute, textTransform: 'uppercase', letterSpacing: '0.05em' }}>
          Processing Pipeline
        </div>
        {parallelFiring && (
          <div style={{ display:'flex', alignItems:'center', gap:4, fontSize:'0.65rem', fontWeight:600,
            color:'#a78bfa', background:'rgba(139,92,246,0.12)', border:'1px solid rgba(139,92,246,0.25)',
            borderRadius:20, padding:'2px 8px' }}>
            <Icon name="zap" size={10} color="#a78bfa" /> 4 agents running in parallel
          </div>
        )}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(8,1fr)', gap: 10 }}>
        {STEPS.map((s, i) => {
          const isParallelCard = s.parallel;
          const isParallelActive = parallelFiring && isParallelCard;
          // After parallel group fires (step>=7), cards 3-6 are done
          const isParallelDone = currentStep >= 7 && isParallelCard;

          const state = done || isParallelDone
            ? 'done'
            : isParallelActive
            ? 'parallel'
            : i < currentStep
            ? 'done'
            : i === currentStep
            ? 'active'
            : 'pending';

          const borderCol = state === 'done' ? C.greenBrd : state === 'active' ? C.blue : state === 'parallel' ? '#8b5cf6' : C.border;
          const bgCol     = state === 'done' ? C.greenLt  : state === 'active' ? C.blueLt  : state === 'parallel' ? 'rgba(139,92,246,0.1)' : C.surface;
          const iconBg    = state === 'done' ? 'rgba(34,197,94,0.2)' : state === 'active' ? 'rgba(59,130,246,0.2)' : state === 'parallel' ? 'rgba(139,92,246,0.18)' : C.surface2;
          const iconCol   = state === 'done' ? C.green : state === 'active' ? C.blue : state === 'parallel' ? '#a78bfa' : C.textMid;
          const labelCol  = state === 'done' ? '#16a34a' : state === 'active' ? C.blue : state === 'parallel' ? '#a78bfa' : C.textMute;

          return (
            <div key={i} style={{
              borderRadius: 12, padding: '12px 6px 10px', textAlign: 'center',
              border: `${state === 'active' || state === 'parallel' ? 2 : 1}px solid ${borderCol}`,
              background: bgCol,
              opacity: state === 'pending' ? 0.5 : 1,
              position: 'relative',
              transition: 'all 0.3s ease',
            }} className={state === 'active' ? 'card-active' : state === 'parallel' ? 'card-parallel' : ''}>

              {state === 'done' && (
                <div style={{ position:'absolute', top:4, right:5 }}>
                  <Icon name="check" size={10} color={C.green} strokeWidth={3} />
                </div>
              )}
              {state === 'parallel' && (
                <div style={{ position:'absolute', top:3, right:4,
                  background:'rgba(139,92,246,0.2)', borderRadius:8, padding:'1px 4px',
                  fontSize:'0.52rem', fontWeight:700, color:'#c4b5fd', letterSpacing:'0.02em' }}>
                  ⚡
                </div>
              )}

              <div style={{ width:38, height:38, borderRadius:10, margin:'0 auto 6px',
                display:'flex', alignItems:'center', justifyContent:'center', background: iconBg }}>
                <Icon name={state === 'done' ? 'check' : s.icon} size={19}
                  color={iconCol} strokeWidth={state === 'done' ? 2.5 : 1.8} />
              </div>
              <div style={{ fontSize:'0.67rem', fontWeight:600, color:labelCol, lineHeight:1.3 }}>{s.label}</div>
              {state === 'parallel' && (
                <div style={{ fontSize:'0.55rem', color:'#7c3aed', marginTop:2, fontWeight:500 }}>parallel</div>
              )}
            </div>
          );
        })}
      </div>
      <div style={{ marginTop: 14, height: 5, background: C.border, borderRadius: 9999, overflow: 'hidden' }}>
        <div className="pipeline-bar" style={{ height:'100%', borderRadius:9999,
          background: parallelFiring
            ? 'linear-gradient(to right,#3b82f6,#8b5cf6,#a78bfa)'
            : 'linear-gradient(to right,#3b82f6,#8b5cf6)',
          width:`${pct}%` }} />
      </div>
      <div style={{ marginTop:5, fontSize:'0.68rem', color: done ? C.green : parallelFiring ? '#a78bfa' : C.textMute, display:'flex', alignItems:'center', gap:5 }}>
        {done && <Icon name="checkcircle" size={12} color={C.green} />}
        {parallelFiring && <Icon name="zap" size={11} color="#a78bfa" />}
        {done ? 'All steps complete' : parallelFiring ? 'Agents 1–4 running simultaneously…' : stepDetail || `Step ${currentStep + 1} of ${STEPS.length}`}
      </div>
    </div>
  );
}

// ── Section header ────────────────────────────────────────────────────────
function SectionHeader({ color, title, sub }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, margin: '28px 0 10px' }}>
      <div style={{ width: 3, height: 22, borderRadius: 2, background: color, flexShrink: 0 }} />
      <div>
        <div style={{ fontSize: '0.95rem', fontWeight: 700, color: C.text }}>{title}</div>
        {sub && <div style={{ fontSize: '0.71rem', color: C.textMute, marginTop: 1 }}>{sub}</div>}
      </div>
    </div>
  );
}

// ── Textarea editor ───────────────────────────────────────────────────────
function DocEditor({ value, onChange, label, color, onSave, saving }) {
  return (
    <div style={{ marginBottom: 24 }}>
      <SectionHeader color={color} title={label} sub="Edit directly — click Save to apply changes" />
      <textarea
        value={value}
        onChange={e => onChange(e.target.value)}
        style={{
          width: '100%', minHeight: 340, background: '#161c2d',
          border: `1px solid ${C.border}`, borderRadius: 10,
          color: C.text, fontFamily: "'Fira Code','Courier New',monospace",
          fontSize: 12.5, lineHeight: 1.65, padding: '14px 16px',
          outline: 'none',
        }}
      />
      <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 8, gap: 8 }}>
        <button
          onClick={onSave}
          disabled={saving}
          style={{
            background: color, color: '#fff', border: 'none', borderRadius: 8,
            padding: '7px 18px', fontSize: '0.82rem', fontWeight: 600,
            cursor: saving ? 'not-allowed' : 'pointer', opacity: saving ? 0.7 : 1,
            display: 'flex', alignItems: 'center', gap: 6,
          }}
        >
          {saving ? <Spinner size={13} /> : <Icon name="save" size={14} color="#fff" />} Save Edits
        </button>
      </div>
    </div>
  );
}

// ── Export card ───────────────────────────────────────────────────────────
function ExportCard({ stripeColor, title, desc, onGenerate, onDownload, generating, docBytes, filename }) {
  return (
    <div style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 12, overflow: 'hidden' }}>
      <div style={{ height: 4, background: stripeColor }} />
      <div style={{ padding: '14px 18px 16px' }}>
        <div style={{ fontSize: '0.85rem', fontWeight: 700, color: C.text, marginBottom: 4 }}>{title}</div>
        <div style={{ fontSize: '0.71rem', color: C.textMute, lineHeight: 1.5, marginBottom: 14 }}>{desc}</div>
        {!docBytes ? (
          <button
            onClick={onGenerate}
            disabled={generating}
            style={{
              width: '100%', background: stripeColor, color: '#fff', border: 'none',
              borderRadius: 8, padding: '9px 0', fontSize: '0.82rem', fontWeight: 600,
              cursor: generating ? 'not-allowed' : 'pointer', opacity: generating ? 0.7 : 1,
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7,
            }}
          >
            {generating ? <><Spinner size={14} /> Generating…</> : <><Icon name="zap" size={14} color="#fff" /> Generate</>}
          </button>
        ) : (
          <button
            onClick={onDownload}
            style={{
              width: '100%', background: C.green, color: '#fff', border: 'none',
              borderRadius: 8, padding: '9px 0', fontSize: '0.82rem', fontWeight: 600,
              cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7,
            }}
          >
            <Icon name="download" size={14} color="#fff" /> Download {filename}
          </button>
        )}
      </div>
    </div>
  );
}

// ── Chat bubble ───────────────────────────────────────────────────────────
function ChatBubble({ role, text }) {
  const isUser = role === 'user';
  return (
    <div style={{
      background: isUser ? C.blueLt : C.surface2,
      borderLeft: `3px solid ${isUser ? C.blue : C.violet}`,
      borderRadius: '0 8px 8px 0', padding: '9px 13px',
      margin: isUser ? '8px 0 4px' : '4px 0 8px',
      fontSize: 13.5, color: C.text, lineHeight: 1.55,
    }} className="fade-in">
      <div style={{ fontSize: '0.63rem', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em', color: isUser ? C.blue : C.violet, marginBottom: 4 }}>
        {isUser ? 'You' : 'AI Assistant'}
      </div>
      {text}
    </div>
  );
}

// ── Document preview renderer ────────────────────────────────────────────
function DocPreview({ text }) {
  if (!text) return <div style={{ color: C.textMute, fontSize: 13, padding: 24 }}>No content yet.</div>;
  const lines = text.split('\n');
  return (
    <div style={{ fontFamily: "'Arial','Helvetica Neue',sans-serif", color: C.text, lineHeight: 1.75, fontSize: '0.92rem', padding: '28px 36px' }}>
      {lines.map((line, i) => {
        const t = line.trim();
        if (!t) return <div key={i} style={{ height: 10 }} />;
        // Answer line (10+ underscores)
        if (/^_{10,}$/.test(t)) {
          return <div key={i} style={{ borderBottom: '1.5px solid #64748b', margin: '10px 0 8px', height: 0, display: 'block' }} />;
        }
        // Image placeholder: [Image: ...] or [image: ...]
        const imgMatch = t.match(/^\[(?:[Ii]mage|IMAGE|Diagram|DIAGRAM|Figure|FIGURE):\s*(.*?)\]$/);
        if (imgMatch) {
          return (
            <div key={i} style={{
              border: '2px dashed #94a3b8', borderRadius: 10,
              background: 'rgba(148,163,184,0.07)',
              padding: '18px 22px', margin: '12px 0',
              display: 'flex', alignItems: 'flex-start', gap: 14,
            }}>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, marginTop: 1 }}>
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
              <div>
                <div style={{ fontSize: '0.7rem', fontWeight: 700, color: '#94a3b8', textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 4 }}>Image — add manually</div>
                <div style={{ fontSize: '0.87rem', color: C.textMid, fontStyle: 'italic', lineHeight: 1.5 }}>{imgMatch[1]}</div>
              </div>
            </div>
          );
        }
        // Total marks line
        if (/\(Total for question/i.test(t)) {
          return <div key={i} style={{ textAlign: 'right', fontWeight: 700, fontSize: '0.85rem', color: C.blue, borderTop: `1px solid ${C.border}`, paddingTop: 6, marginTop: 10, marginBottom: 18 }}>{t}</div>;
        }
        // Mark indicator at end: (3) or (3 marks)
        const markMatch = t.match(/^(.*?)\s*\((\d+)\s*(?:marks?)?\)\s*$/);
        if (markMatch && markMatch[2]) {
          const content = markMatch[1].trim();
          const isQ = /^[0-9]/.test(content);
          return (
            <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', margin: isQ ? '14px 0 4px' : '3px 0' }}>
              <span style={{ fontWeight: isQ ? 700 : 400 }}>{content}</span>
              <span style={{ fontWeight: 700, fontSize: '0.8rem', color: C.textMid, flexShrink: 0, marginLeft: 16, fontFamily: 'sans-serif' }}>({markMatch[2]})</span>
            </div>
          );
        }
        // Question number line (starts with digit or (a) etc.)
        if (/^(\d+|[a-z]\)|[ivx]+\))/.test(t)) {
          return <div key={i} style={{ fontWeight: 600, margin: '12px 0 4px' }}>{t}</div>;
        }
        return <div key={i} style={{ margin: '3px 0', color: t.startsWith('(') ? C.textMid : C.text }}>{t}</div>;
      })}
    </div>
  );
}

// ── Content tabs ──────────────────────────────────────────────────────────
function ContentTabs({ active, onChange }) {
  const tabs = [
    { id: 'worksheet',   icon: 'filetext',  label: 'Worksheet Editor' },
    { id: 'markscheme',  icon: 'clipboard', label: 'Mark Scheme'      },
    { id: 'chat',        icon: 'send',      label: 'AI Assistant'     },

  return (
    <div style={{ display: 'flex', borderBottom: `1px solid ${C.border}`, background: C.surface, paddingLeft: 24 }}>
      {tabs.map(t => {
        const on = t.id === active;
        return (
          <button key={t.id} onClick={() => onChange(t.id)} style={{
            background: 'none', border: 'none', cursor: 'pointer',
            padding: '14px 20px 13px', display: 'flex', alignItems: 'center', gap: 8,
            fontSize: '0.82rem', fontWeight: on ? 700 : 500,
            color: on ? C.text : C.textMute,
            borderBottom: `2px solid ${on ? C.blue : 'transparent'}`,
            marginBottom: -1, transition: 'color 0.15s, border-color 0.15s',

}

// ── Main App ──────────────────────────────────────────────────────────────
function App() {
  // Files
  const [wsFile, setWsFile]       = useState(null);
  const [msFile, setMsFile]       = useState(null);
  const [specTxtFile, setSpecTxt] = useState(null);
  const [specDocxFile, setSpecDocx] = useState(null);
  const [pastedSpec, setPastedSpec] = useState('');
  const [specImgFiles, setSpecImgFiles] = useState([]); // array of File objects — OCR'd at pipeline start
  const [specImgDragging, setSpecImgDragging] = useState(false);

  // Pipeline state
  const [running, setRunning]       = useState(false);
  const [currentStep, setCurrentStep] = useState(-1);
  const [stepDetail, setStepDetail] = useState('');

  // Results
  const [worksheet, setWorksheet]   = useState('');
  const [markscheme, setMarkscheme] = useState('');
  const [hasResults, setHasResults] = useState(false);
  const [pipelineStats, setPipelineStats] = useState(null);

  // Tab & view state
  const [activeTab, setActiveTab]     = useState('worksheet');
  const [previewWs, setPreviewWs]     = useState(true);
  const [previewMs, setPreviewMs]     = useState(true);

  // Worksheet naming (auto-populated from filename)
  const [wsTitle, setWsTitle] = useState('');

  // Export
  const [wsDocBytes, setWsDocBytes]   = useState(null);
  const [msDocBytes, setMsDocBytes]   = useState(null);
  const [genWs, setGenWs]   = useState(false);
  const [genMs, setGenMs]   = useState(false);
  const [wsFilename, setWsFilename] = useState('worksheet.docx');
  const [msFilename, setMsFilename] = useState('markscheme.docx');

  // Chat
  const [chatMsgs, setChatMsgs]     = useState([]);
  const [chatInput, setChatInput]   = useState('');
  const [chatLoading, setChatLoading] = useState(false);

  // Error
  const [error, setError] = useState('');

  const chatEndRef = useRef();

  useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [chatMsgs]);

  // ── Reset all state for a fresh worksheet ────────────────────────────────
  const resetAll = () => {
    setWsFile(null); setMsFile(null); setSpecTxt(null); setSpecDocx(null); setPastedSpec('');
    setRunning(false); setCurrentStep(-1); setStepDetail('');
    setWorksheet(''); setMarkscheme(''); setHasResults(false); setPipelineStats(null);
    setActiveTab('worksheet'); setPreviewWs(true); setPreviewMs(true);
    setWsTitle('');
    setWsDocBytes(null); setMsDocBytes(null); setGenWs(false); setGenMs(false);
    setWsFilename('worksheet.docx'); setMsFilename('markscheme.docx');
    setChatMsgs([]); setChatInput(''); setChatLoading(false);
    setError('');
    // UploadZone components own their own inputs and clear them internally
  };

  // ── Spec image OCR (supports multiple images) ────────────────────────────
  // ── Run pipeline ─────────────────────────────────────────────────────────
  const runPipeline = async () => {
    if (!wsFile) { setError('Please upload a Worksheet .docx file first.'); return; }
    setError('');
    setRunning(true);
    setCurrentStep(0);
    setHasResults(false);
    setWsDocBytes(null);
    setMsDocBytes(null);
    setChatMsgs([]); setChatInput('');

    // ── OCR any queued spec images before starting the pipeline ─────────────
    let effectiveSpec = pastedSpec;
    if (specImgFiles.length > 0) {
      const imgResults = [];
      for (let i = 0; i < specImgFiles.length; i++) {
        setStepDetail(`Scanning spec image ${i + 1} of ${specImgFiles.length}…`);
        try {
          const ocrForm = new FormData();
          ocrForm.append('file', specImgFiles[i]);
          const ocrRes = await fetch(`${API}/api/spec-ocr`, { method: 'POST', body: ocrForm });
          if (!ocrRes.ok) throw new Error(`${ocrRes.status}`);
          const ocrData = await ocrRes.json();
          if (ocrData.text) imgResults.push(ocrData.text);
        } catch (_) { /* skip individual failed images silently */ }
      }
      if (imgResults.length > 0) {
        const imgText = imgResults.join('\n\n');
        effectiveSpec = effectiveSpec ? effectiveSpec + '\n\n' + imgText : imgText;
      } else if (!pastedSpec.trim()) {
        // Every image failed and no pasted spec either — abort
        setError('Could not read any of the spec images. Check your connection and try again.');
        setRunning(false);
        setStepDetail('');
        return;
      }
      setStepDetail('');
    }

    const form = new FormData();
    form.append('worksheet', wsFile);
    if (msFile)          form.append('markscheme', msFile);
    if (specTxtFile)     form.append('spec_txt', specTxtFile);
    if (specDocxFile)    form.append('spec_docx', specDocxFile);
    if (effectiveSpec)   form.append('pasted_spec', effectiveSpec);

    try {
      const res = await fetch(`${API}/api/process`, { method: 'POST', body: form });
      if (!res.ok) throw new Error(`Server error ${res.status}`);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const data = JSON.parse(line.slice(6));
            if (data.error) {
              setError(`Pipeline error: ${data.message || 'An unexpected error occurred. Please try again.'}`);
            } else if (data.done) {
              setWorksheet(data.worksheet || '');
              setMarkscheme(data.markscheme || '');
              setHasResults(true);
              if (data.pipeline_stats) setPipelineStats(data.pipeline_stats);
              setCurrentStep(STEPS.length);
              setStepDetail('');
              const rawBase = wsTitle || (wsFile ? wsFile.name.replace(/\.docx$/i, '') : 'worksheet');
              // Strip characters that are invalid in Windows/macOS filenames
              const base = rawBase.replace(/[/\\:*?"<>|]+/g, '_').trim() || 'worksheet';
              setWsFilename(base + '_enhanced.docx');
              setMsFilename(base.replace(/QP/i, 'MS') + '_MS.docx');
            } else {
              setCurrentStep(data.step || 0);
              setStepDetail(data.detail || '');
            }
          } catch {}
        }
      }
    } catch (err) {
      setError(`Error: ${err.message}. Make sure the server is running and your OpenAI API key is set.`);
    } finally {
      setRunning(false);
    }
  };

  // ── Export ────────────────────────────────────────────────────────────────
  const generateWs = async () => {
    setGenWs(true);
    try {
      const res = await fetch(`${API}/api/export/worksheet`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: worksheet, filename: wsFilename }),
      });
      if (!res.ok) throw new Error(await res.text());
      const blob = await res.blob();
      setWsDocBytes(blob);
    } catch (e) { setError(`Export failed: ${e.message}`); }
    finally { setGenWs(false); }
  };

  const generateMs = async () => {
    setGenMs(true);
    try {
      const res = await fetch(`${API}/api/export/markscheme`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: markscheme, filename: msFilename }),
      });
      if (!res.ok) throw new Error(await res.text());
      const blob = await res.blob();
      setMsDocBytes(blob);
    } catch (e) { setError(`Export failed: ${e.message}`); }
    finally { setGenMs(false); }
  };

  const downloadBlob = (blob, name) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  // ── Chat ─────────────────────────────────────────────────────────────────
  const sendChat = async (msg) => {
    const text = (msg || chatInput).trim();
    if (!text) return;
    setChatInput('');
    setChatMsgs(prev => [...prev, { role: 'user', text }]);
    setChatLoading(true);
    try {
      const res = await fetch(`${API}/api/chat`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, worksheet, markscheme, history: chatMsgs, spec: pastedSpec }),
      });
      const data = await res.json();
      setChatMsgs(prev => [...prev, { role: 'assistant', text: data.reply }]);
      if (data.updated_worksheet)  setWorksheet(data.updated_worksheet);
      if (data.updated_markscheme) setMarkscheme(data.updated_markscheme);
      if (data.updated_worksheet || data.updated_markscheme) {
        setWsDocBytes(null); setMsDocBytes(null);
      }
    } catch (e) { setChatMsgs(prev => [...prev, { role: 'assistant', text: `Error: ${e.message}` }]); }
    finally { setChatLoading(false); }
  };

  // ── QA validation ─────────────────────────────────────────────────────────
  const qaOverlap = (() => {
    if (!worksheet || !markscheme) return null;
    const words = t => new Set(t.toLowerCase().match(/\b[a-z]{5,}\b/g) || []);
    const w1 = words(worksheet), w2 = words(markscheme);
    if (!w1.size) return null;
    return Math.round(([...w1].filter(x => w2.has(x)).length / w1.size) * 100);
  })();

  // ── Worksheet text stats (stats row only) ────────────────────────────────
  const wsStats = React.useMemo(() => {
    if (!worksheet) return null;
    // Total marks from "Total for question X is N marks" lines
    let totalMarks = 0;
    for (const line of worksheet.split('\n')) {
      const tm = line.match(/Total for question \d+ is (\d+) marks/i);
      if (tm) totalMarks += parseInt(tm[1]);
    }
    // Question + sub-part count
    const mainQs = new Set();
    for (const line of worksheet.split('\n')) {
      const m = line.match(/^(\d+)\s+\S/);
      if (m && parseInt(m[1]) <= 50) mainQs.add(m[1]);
    }
    const subParts = (worksheet.match(/^\s*\([a-z]\)\s/gm) || []).length;
    return { totalMarks, mainQCount: mainQs.size, subParts };
  }, [worksheet]);

  // ── Render ────────────────────────────────────────────────────────────────
  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', background: C.bg }}>

      {/* ── SIDEBAR ── */}
      <aside style={{
        width: 272, flexShrink: 0, display: 'flex', flexDirection: 'column',
        background: `linear-gradient(180deg, ${C.surface} 0%, #131929 100%)`,
        borderRight: `1px solid ${C.border}`, overflow: 'auto',
      }}>
        {/* Logo */}
        <div style={{ padding: '18px 16px 14px', borderBottom: `1px solid ${C.border}` }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <Logo size={38} />
            <div>
              <div style={{ fontSize: '0.95rem', fontWeight: 800, color: C.text, letterSpacing: '-0.02em' }}>examqa.com</div>
              <div style={{ fontSize: '0.62rem', fontWeight: 500, color: C.textMute, textTransform: 'uppercase', letterSpacing: '0.06em' }}>Worksheet Studio</div>
            </div>
          </div>
        </div>

        <div style={{ padding: '0 16px', flex: 1 }}>
          {/* Documents */}
          <div style={{ fontSize: '0.65rem', fontWeight: 700, color: C.textMute, textTransform: 'uppercase', letterSpacing: '0.1em', margin: '16px 0 7px' }}>Documents</div>

          {/* Worksheet upload */}
          <UploadZone icon="doc" label="Worksheet" hint=".docx — click or drag" accept=".docx" required
            file={wsFile}
            onFile={(f) => { setWsFile(f); setWsTitle(f.name.replace(/\.docx$/i,'').replace(/[_-]+/g,' ').trim()); }}
            onClear={() => setWsFile(null)} />

          {/* Mark scheme upload */}
          <UploadZone icon="clipboard" label="Mark Scheme" hint=".docx — click or drag" accept=".docx" required={false}
            file={msFile}
            onFile={(f) => setMsFile(f)}
            onClear={() => setMsFile(null)} />

          <Divider />

          {/* Spec section */}
          <div style={{ fontSize: '0.65rem', fontWeight: 700, color: C.textMute, textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: 7 }}>
            Specification <span style={{ fontWeight: 400, textTransform: 'none' }}>— optional</span>
          </div>
          <UploadZone icon="alignleft" label="Spec (.txt)" hint=".txt — click or drag" accept=".txt" required={false}
            file={specTxtFile}
            onFile={(f) => setSpecTxt(f)}
            onClear={() => setSpecTxt(null)} />

          <UploadZone icon="alignleft" label="Spec (.docx)" hint=".docx — click or drag" accept=".docx" required={false}
            file={specDocxFile}
            onFile={(f) => setSpecDocx(f)}
            onClear={() => setSpecDocx(null)} />

          {/* Scan images from book */}
          <div style={{ fontSize: '0.68rem', color: C.textMute, margin: '10px 0 4px', fontWeight: 500 }}>Or scan book / spec page photos</div>
          <div style={{
            border: `1.5px dashed ${specImgDragging ? C.blue : specImgFiles.length > 0 ? C.green : C.border}`,
            borderRadius: 8, padding: '10px 12px',
            cursor: running ? 'default' : 'pointer',
            background: specImgDragging ? C.blueLt : specImgFiles.length > 0 ? 'rgba(34,197,94,0.06)' : C.surface3,
            display: 'flex', alignItems: 'center', gap: 10,
            transition: 'all 0.15s',
          }}
            onClick={() => { if (!running) document.getElementById('spec-img-input').click(); }}
            onDragOver={e => { e.preventDefault(); if (!running) setSpecImgDragging(true); }}
            onDragEnter={e => { e.preventDefault(); if (!running) setSpecImgDragging(true); }}
            onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setSpecImgDragging(false); }}
            onDrop={e => {
              e.preventDefault(); setSpecImgDragging(false);
              if (running) return;
              const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
              if (files.length > 0) setSpecImgFiles(prev => [...prev, ...files]);
            }}
          >
            <input id="spec-img-input" type="file" accept="image/*" multiple style={{ display: 'none' }}
              onChange={e => {
                const files = Array.from(e.target.files);
                if (files.length > 0) setSpecImgFiles(prev => [...prev, ...files]);
                e.target.value = '';
              }}
            />
            {specImgFiles.length > 0
              ? <>
                  <Icon name="checkcircle" size={15} color={C.green} />
                  <span style={{ fontSize: 11.5, color: C.text, flex: 1 }}>
                    {specImgFiles.length} image{specImgFiles.length > 1 ? 's' : ''} queued — scanned automatically when you run the pipeline
                  </span>
                  <button onClick={e => { e.stopPropagation(); setSpecImgFiles([]); }}
                    style={{ background: 'none', border: 'none', cursor: 'pointer', color: C.textMute, fontSize: 13, padding: 0, lineHeight: 1 }}>✕</button>
                </>
              : <>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={C.textMute} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                  </svg>
                  <span style={{ fontSize: 11.5, color: specImgDragging ? C.blue : C.textMute }}>{specImgDragging ? 'Drop images here' : 'Click or drag CGP book / spec photos — scanned when you run the pipeline'}</span>
                </>
            }
          </div>

          <div style={{ fontSize: '0.68rem', color: C.textMute, margin: '10px 0 4px', fontWeight: 500 }}>Or paste specification text</div>
          <textarea
            value={pastedSpec}
            onChange={e => setPastedSpec(e.target.value)}
            placeholder="Paste specification text here… (images above are scanned separately at pipeline run time)"
            style={{
              width: '100%', height: 80, background: C.surface3,
              border: `1px solid ${C.border}`, borderRadius: 8, color: C.text,
              fontSize: 11.5, padding: '8px 10px', outline: 'none', resize: 'vertical',
            }}
          />

          <Divider />

          {/* Run button */}
          <button
            onClick={runPipeline}
            disabled={running || !wsFile}
            style={{
              width: '100%', padding: '10px 0', borderRadius: 9, border: 'none',
              background: (running || !wsFile) ? C.surface3 : 'linear-gradient(135deg,#2563eb,#7c3aed)',
              color: (running || !wsFile) ? C.textMute : '#fff',
              fontWeight: 700, fontSize: '0.85rem', cursor: (running || !wsFile) ? 'not-allowed' : 'pointer',
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
              boxShadow: (!running && wsFile) ? '0 4px 14px rgba(124,58,237,0.4)' : 'none',
              transition: 'all 0.2s',
            }}
          >
            {running
              ? <><Spinner size={14} /> Running…</>
              : <><Icon name="sparkles" size={15} color="#fff" /> Run Enhancement Pipeline</>
            }
          </button>
          <div style={{ fontSize: '0.66rem', color: C.textMute, textAlign: 'center', marginTop: 6 }}>5-step pipeline · agents 1–4 run in parallel</div>
        </div>
      </aside>

      {/* ── MAIN CONTENT ── */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

        {/* Navbar */}
        <nav style={{
          background: C.surface, borderBottom: `1px solid ${C.border}`,
          padding: '0 24px', height: 64, display: 'flex', alignItems: 'center',
          gap: 12, flexShrink: 0,
        }}>
          <Logo size={34} />
          <div>
            <div style={{ fontSize: '0.92rem', fontWeight: 700, color: C.text, letterSpacing: '-0.01em', lineHeight: 1.2 }}>GCSE Worksheet QA Studio</div>
            <div style={{ fontSize: '0.68rem', color: C.textMute, lineHeight: 1 }}>AI-powered exam paper enhancement</div>
          </div>
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 8 }}>
            {(hasResults || running || wsFile) && (
              <button
                onClick={resetAll}
                style={{
                  background: 'none', color: C.textMid, border: `1px solid ${C.border}`,
                  borderRadius: 8, padding: '7px 14px', fontSize: '0.77rem', fontWeight: 600,
                  cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6,
                  transition: 'all 0.15s',
                }}
                onMouseEnter={e => { e.target.style.borderColor = C.blue; e.target.style.color = C.blue; }}
                onMouseLeave={e => { e.target.style.borderColor = C.border; e.target.style.color = C.textMid; }}
              >
                <Icon name="filetext" size={13} color="currentColor" /> New Worksheet
              </button>
            )}
            {hasResults && (
              <button
                onClick={() => { generateWs(); generateMs(); }}
                style={{
                  background: 'linear-gradient(135deg,#2563eb,#7c3aed)', color: '#fff',
                  border: 'none', borderRadius: 8, padding: '7px 14px',
                  fontSize: '0.77rem', fontWeight: 600, cursor: 'pointer',
                  display: 'flex', alignItems: 'center', gap: 6,
                  boxShadow: '0 2px 8px rgba(124,58,237,0.4)',
                }}
              ><Icon name="export" size={14} color="#fff" /> Export All</button>
            )}
          </div>
        </nav>

        {/* Scrollable body */}
        <div style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden' }}>

          {/* Error banner */}
          {error && (
            <div style={{ background: 'rgba(248,113,113,0.12)', border: `1px solid rgba(248,113,113,0.3)`, borderRadius: 0, padding: '10px 24px', fontSize: '0.82rem', color: C.red, display: 'flex', alignItems: 'center', gap: 10 }}>
              <Icon name="x" size={15} color={C.red} strokeWidth={2.5} /> {error}
              <button onClick={() => setError('')} style={{ marginLeft: 'auto', background: 'none', border: 'none', color: C.red, cursor: 'pointer', display:'flex', alignItems:'center' }}><Icon name="x" size={15} color={C.red} strokeWidth={2.5} /></button>
            </div>
          )}

          {/* Pipeline — shown while running or after done */}
          {(running || hasResults) && (
            <Pipeline currentStep={currentStep} stepDetail={stepDetail} />
          )}

          {/* Welcome / idle state */}
          {!running && !hasResults && (
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '60vh', gap: 16, padding: 40 }}>
              <Logo size={56} />
              <div style={{ fontSize: '1.4rem', fontWeight: 800, color: C.text, letterSpacing: '-0.02em', textAlign: 'center' }}>
                GCSE Worksheet <span className="grad-text">QA Studio</span>
              </div>
              <div style={{ fontSize: '0.88rem', color: C.textMute, textAlign: 'center', maxWidth: 420, lineHeight: 1.6 }}>
                Upload your worksheet and mark scheme in the sidebar, then click <strong style={{ color: C.text }}>Run Enhancement Pipeline</strong> to begin — agents 1–4 run in parallel for speed.
              </div>
              <div style={{ display: 'flex', gap: 12, marginTop: 8, flexWrap: 'wrap', justifyContent: 'center' }}>
                {['Command word alignment', 'Mark scheme structure', 'Cognitive balance', 'Topic coverage', 'GCSE-style revision'].map(t => (
                  <span key={t} style={{ background: C.surface2, border: `1px solid ${C.border}`, borderRadius: 20, padding: '5px 14px', fontSize: 12, color: C.textMid, display:'inline-flex', alignItems:'center', gap:5 }}><Icon name="check" size={11} color={C.blue} strokeWidth={2.5} />{t}</span>
                ))}
              </div>
            </div>
          )}

          {/* Worksheet naming header (shown when results are ready) */}
          {hasResults && (
            <div style={{ padding: '12px 24px', borderBottom: `1px solid ${C.border}`, background: C.surface, display: 'flex', alignItems: 'center', gap: 10 }} className="fade-in">
              <Icon name="filetext" size={16} color={C.textMute} />
              <input
                value={wsTitle}
                onChange={e => setWsTitle(e.target.value)}
                placeholder="Worksheet title…"
                style={{ background: 'none', border: 'none', color: C.text, fontSize: '0.95rem', fontWeight: 700, outline: 'none', flex: 1, padding: '2px 0' }}
              />
              <span style={{ fontSize: '0.7rem', color: C.textMute, whiteSpace: 'nowrap' }}>Used as download filename</span>
            </div>
          )}

          {/* Content tabs (shown when results are ready) */}
          {hasResults && <ContentTabs active={activeTab} onChange={setActiveTab} />}

          {/* Results */}
          {hasResults && (
            <div>

              {/* ── Stats row — always visible when results exist ── */}
              {wsStats && (
                <div className="fade-in" style={{ margin: '16px 24px 0', display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 8 }}>
                  {/* Total marks */}
                  <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: '10px 14px' }}>
                    <div style={{ fontSize: '0.62rem', fontWeight: 700, color: C.textMute, textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 3 }}>Total Marks</div>
                    <div style={{ fontSize: '1.5rem', fontWeight: 800, color: C.blue, lineHeight: 1 }}>{wsStats.totalMarks || '—'}</div>
                  </div>
                  {/* Questions */}
                  <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: '10px 14px' }}>
                    <div style={{ fontSize: '0.62rem', fontWeight: 700, color: C.textMute, textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 3 }}>Questions</div>
                    <div style={{ fontSize: '1.5rem', fontWeight: 800, color: C.violet, lineHeight: 1 }}>{wsStats.mainQCount}</div>
                    <div style={{ fontSize: '0.65rem', color: C.textMute, marginTop: 2 }}>{wsStats.subParts} sub-parts</div>
                  </div>
                  {/* Issues flagged */}
                  <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: '10px 14px' }}>
                    <div style={{ fontSize: '0.62rem', fontWeight: 700, color: C.textMute, textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 3 }}>Issues Fixed</div>
                    {pipelineStats
                      ? <>
                          <div style={{ fontSize: '1.5rem', fontWeight: 800, color: pipelineStats.total > 0 ? C.green : C.textMid, lineHeight: 1 }}>{pipelineStats.total}</div>
                          <div style={{ fontSize: '0.63rem', color: C.textMute, marginTop: 2 }}>
                            {[
                              pipelineStats.command_word  > 0 && `${pipelineStats.command_word} cmd`,
                              pipelineStats.mark_scheme   > 0 && `${pipelineStats.mark_scheme} ms`,
                              pipelineStats.cognitive     > 0 && `${pipelineStats.cognitive} cog`,
                              pipelineStats.coverage      > 0 && `${pipelineStats.coverage} scope`,
                            ].filter(Boolean).join(' · ')}
                          </div>
                        </>
                      : <div style={{ fontSize: '0.72rem', color: C.textMute, marginTop: 4 }}>Run pipeline to see</div>
                    }
                  </div>
                  {/* Keyword alignment */}
                  <div style={{
                    background: qaOverlap === null ? C.surface : qaOverlap >= 40 ? C.greenLt : 'rgba(248,113,113,0.08)',
                    border: `1px solid ${qaOverlap === null ? C.border : qaOverlap >= 40 ? C.greenBrd : 'rgba(248,113,113,0.3)'}`,
                    borderRadius: 10, padding: '10px 14px',
                  }}>
                    <div style={{ fontSize: '0.62rem', fontWeight: 700, color: C.textMute, textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 3 }}>WS ↔ MS Match</div>
                    {qaOverlap !== null
                      ? <>
                          <div style={{ fontSize: '1.5rem', fontWeight: 800, color: qaOverlap >= 40 ? C.green : C.red, lineHeight: 1 }}>{qaOverlap}%</div>
                          <div style={{ fontSize: '0.63rem', color: C.textMute, marginTop: 2 }}>{qaOverlap >= 40 ? 'Good alignment' : 'Low overlap'}</div>
                        </>
                      : <div style={{ fontSize: '0.72rem', color: C.textMute, marginTop: 4 }}>—</div>
                    }
                  </div>
                </div>
              )}

              {/* ── Pipeline Insights panel — injected below stats row ── */}
              {pipelineStats && pipelineStats._insights && pipelineStats._insights.length > 0 && (
                <div className="fade-in" style={{ margin: '10px 24px 0', background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: '14px 16px' }}>
                  <div style={{ fontSize: '0.62rem', fontWeight: 700, color: C.textMute, textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 10 }}>Pipeline Insights</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
                    {pipelineStats._insights.map((ins, i) => (
                      <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
                        <span style={{
                          flexShrink: 0, fontSize: '0.6rem', fontWeight: 700, textTransform: 'uppercase',
                          letterSpacing: '0.05em', padding: '2px 7px', borderRadius: 20,
                          background: ins.level === 'warn' ? 'rgba(251,191,36,0.12)' : ins.level === 'fix' ? 'rgba(34,197,94,0.1)' : 'rgba(148,163,184,0.1)',
                          color:       ins.level === 'warn' ? '#f59e0b'              : ins.level === 'fix' ? C.green                : C.textMute,
                          border:      `1px solid ${ins.level === 'warn' ? 'rgba(251,191,36,0.3)' : ins.level === 'fix' ? 'rgba(34,197,94,0.25)' : C.border}`,
                          marginTop: 1,
                        }}>
                          {ins.level === 'warn' ? 'Found' : ins.level === 'fix' ? 'Fixed' : 'Info'}
                        </span>
                        <span style={{ fontSize: '0.8rem', color: C.textMid, lineHeight: 1.45 }}>{ins.text}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ── WORKSHEET TAB ── */}
              {activeTab === 'worksheet' && (
                <div style={{ padding: '0 24px 40px' }}>
                  {/* Image placeholder callout */}
                  {worksheet && /\[\s*(?:image|diagram|figure)\s*:/i.test(worksheet) && (
                    <div className="fade-in" style={{
                      display: 'flex', alignItems: 'flex-start', gap: 14,
                      background: 'rgba(251,191,36,0.08)', border: '1px solid rgba(251,191,36,0.35)',
                      borderRadius: 10, padding: '13px 18px', margin: '16px 0 4px',
                    }}>
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, marginTop: 1 }}>
                        <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                      </svg>
                      <div>
                        <div style={{ fontSize: '0.78rem', fontWeight: 700, color: '#f59e0b', marginBottom: 3 }}>This worksheet contains image placeholders</div>
                        <div style={{ fontSize: '0.8rem', color: C.textMid, lineHeight: 1.55 }}>
                          Diagrams and figures cannot be generated automatically. Once you export the .docx, insert each image manually where the placeholder box appears.
                          Each placeholder includes a description of what the image should show.
                        </div>
                      </div>
                    </div>
                  )}
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', margin: '18px 0 10px' }}>
                    <div>
                      <div style={{ fontSize: '0.95rem', fontWeight: 700, color: C.text }}>Enhanced Worksheet</div>
                      <div style={{ fontSize: '0.72rem', color: C.textMute, marginTop: 2 }}>Review, edit, then export to .docx</div>
                    </div>
                    <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                      {[['Preview', true], ['Edit', false]].map(([lbl, val]) => (
                        <button key={lbl} onClick={() => setPreviewWs(val)} style={{
                          background: previewWs === val ? C.surface3 : 'none',
                          border: `1px solid ${previewWs === val ? C.border2 : C.border}`,
                          borderRadius: 7, padding: '5px 14px', color: previewWs === val ? C.text : C.textMute,
                          fontSize: '0.78rem', fontWeight: previewWs === val ? 600 : 400, cursor: 'pointer',
                        }}>{lbl}</button>
                      ))}
                      {!wsDocBytes
                        ? <button onClick={generateWs} disabled={genWs} style={{ background: C.blue, color:'#fff', border:'none', borderRadius:7, padding:'5px 14px', fontSize:'0.78rem', fontWeight:600, cursor: genWs ? 'not-allowed' : 'pointer', opacity: genWs ? 0.7 : 1, display:'flex', alignItems:'center', gap:6 }}>
                            {genWs ? <><Spinner size={12}/> Generating…</> : <><Icon name="download" size={13} color="#fff"/> Export .docx</>}
                          </button>
                        : <button onClick={() => downloadBlob(wsDocBytes, wsFilename)} style={{ background: C.green, color:'#fff', border:'none', borderRadius:7, padding:'5px 14px', fontSize:'0.78rem', fontWeight:600, cursor:'pointer', display:'flex', alignItems:'center', gap:6 }}>
                            <Icon name="download" size={13} color="#fff"/> Download
                          </button>
                      }
                    </div>
                  </div>
                  <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, overflow: 'hidden', minHeight: 400 }}>
                    {previewWs
                      ? <DocPreview text={worksheet} />
                      : <textarea value={worksheet} onChange={e => { setWorksheet(e.target.value); setWsDocBytes(null); }}
                          style={{ width:'100%', minHeight:460, background:'transparent', border:'none', color: C.text, fontFamily:"'Fira Code','Courier New',monospace", fontSize:12.5, lineHeight:1.65, padding:'20px 24px', outline:'none', resize:'vertical' }}
                        />
                    }
                  </div>
                </div>
              )}

              {/* ── MARK SCHEME TAB ── */}
              {activeTab === 'markscheme' && (
                <div style={{ padding: '0 24px 40px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', margin: '18px 0 10px' }}>
                    <div>
                      <div style={{ fontSize: '0.95rem', fontWeight: 700, color: C.text }}>Mark Scheme</div>
                      <div style={{ fontSize: '0.72rem', color: C.textMute, marginTop: 2 }}>Review, edit, then export to .docx</div>
                    </div>
                    <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                      {[['Preview', true], ['Edit', false]].map(([lbl, val]) => (
                        <button key={lbl} onClick={() => setPreviewMs(val)} style={{
                          background: previewMs === val ? C.surface3 : 'none',
                          border: `1px solid ${previewMs === val ? C.border2 : C.border}`,
                          borderRadius: 7, padding: '5px 14px', color: previewMs === val ? C.text : C.textMute,
                          fontSize: '0.78rem', fontWeight: previewMs === val ? 600 : 400, cursor: 'pointer',
                        }}>{lbl}</button>
                      ))}
                      {!msDocBytes
                        ? <button onClick={generateMs} disabled={genMs} style={{ background: C.violet, color:'#fff', border:'none', borderRadius:7, padding:'5px 14px', fontSize:'0.78rem', fontWeight:600, cursor: genMs ? 'not-allowed' : 'pointer', opacity: genMs ? 0.7 : 1, display:'flex', alignItems:'center', gap:6 }}>
                            {genMs ? <><Spinner size={12}/> Generating…</> : <><Icon name="download" size={13} color="#fff"/> Export .docx</>}
                          </button>
                        : <button onClick={() => downloadBlob(msDocBytes, msFilename)} style={{ background: C.green, color:'#fff', border:'none', borderRadius:7, padding:'5px 14px', fontSize:'0.78rem', fontWeight:600, cursor:'pointer', display:'flex', alignItems:'center', gap:6 }}>
                            <Icon name="download" size={13} color="#fff"/> Download
                          </button>
                      }
                    </div>
                  </div>
                  <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, overflow: 'hidden', minHeight: 400 }}>
                    {previewMs
                      ? <DocPreview text={markscheme} />
                      : <textarea value={markscheme} onChange={e => { setMarkscheme(e.target.value); setMsDocBytes(null); }}
                          style={{ width:'100%', minHeight:460, background:'transparent', border:'none', color: C.text, fontFamily:"'Fira Code','Courier New',monospace", fontSize:12.5, lineHeight:1.65, padding:'20px 24px', outline:'none', resize:'vertical' }}
                        />
                    }
                  </div>
                </div>
              )}

              {/* ── AI ASSISTANT TAB ── */}
              {activeTab === 'chat' && (
                <div style={{ padding: '0 24px 40px' }}>
                  <div style={{ margin: '18px 0 14px' }}>
                    <div style={{ fontSize: '0.95rem', fontWeight: 700, color: C.text }}>AI Assistant</div>
                    <div style={{ fontSize: '0.72rem', color: C.textMute, marginTop: 2 }}>Make targeted edits — changes apply to your documents automatically</div>
                  </div>

                  {/* Suggestion chips */}
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 16 }}>
                    {['Change Olivia to Mustafa throughout', 'Make Q3b an explain question, 4 marks', 'Fix the calculation in question 2'].map(c => (
                      <button key={c} onClick={() => sendChat(c)} style={{
                        background: C.blueLt, border: `1px solid rgba(59,130,246,0.2)`,
                        borderRadius: 20, padding: '5px 14px', fontSize: 11.5,
                        color: C.blue, fontWeight: 500, cursor: 'pointer',
                      }}>{c}</button>
                    ))}
                  </div>

                  {/* Chat welcome */}
                  {chatMsgs.length === 0 && (
                    <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: '20px 24px', display: 'flex', gap: 16, alignItems: 'flex-start', marginBottom: 16 }} className="fade-in">
                      <Logo size={36} />
                      <div>
                        <div style={{ fontWeight: 600, fontSize: '0.88rem', color: C.text, marginBottom: 4 }}>examqa AI</div>
                        <div style={{ fontSize: '0.84rem', color: C.textMid, lineHeight: 1.6 }}>
                          Hi! I can help you improve your worksheet questions, suggest mark schemes, or answer questions about exam board requirements. What would you like to work on?
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Messages */}
                  {chatMsgs.length > 0 && (
                    <div style={{ maxHeight: 380, overflowY: 'auto', marginBottom: 12, display:'flex', flexDirection:'column', gap: 4 }}>
                      {chatMsgs.map((m, i) => <ChatBubble key={i} role={m.role} text={m.text} />)}
                      {chatLoading && (
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 14px', color: C.textMute, fontSize: 13 }}>
                          <Spinner size={14} /> AI is thinking…
                        </div>
                      )}
                      <div ref={chatEndRef} />
                  </div>
                )}

                {/* Input */}
                <div style={{ display: 'flex', gap: 8 }}>
                  <input
                    value={chatInput}
                    onChange={e => setChatInput(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && !e.shiftKey && sendChat()}
                    placeholder="Ask the AI to make changes…"
                    style={{
                      flex: 1, background: C.surface2, border: `1px solid ${C.border}`,
                      borderRadius: 8, padding: '10px 14px', color: C.text, fontSize: 13.5,
                      outline: 'none',
                    }}
                  />
                  <button
                    onClick={() => sendChat()}
                    disabled={chatLoading || !chatInput.trim()}
                    style={{
                      background: C.blue, color: '#fff', border: 'none', borderRadius: 8,
                      padding: '0 18px', fontWeight: 700, fontSize: '0.85rem',
                      cursor: (chatLoading || !chatInput.trim()) ? 'not-allowed' : 'pointer',
                      opacity: (chatLoading || !chatInput.trim()) ? 0.6 : 1,
                    }}
                  ><Icon name="send" size={14} color="#fff" /></button>
                </div>
              </div>
              )}

            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
